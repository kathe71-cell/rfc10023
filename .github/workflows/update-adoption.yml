name: Update RFC 10023 Adoption Data

on:
  schedule:
    # 1. Domains Monitor Frühlauf: 05:00 UTC (07:00 MESZ / 06:00 MEZ)
    - cron: '0 5 * * *'
    # 2. ForSaleDNS Nachmittagslauf: 13:30 UTC (15:30 MESZ / 14:30 MEZ)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Welche Adoption-Quelle soll aktualisiert werden?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - domains-monitor
          - forsaledns

permissions:
  contents: write

concurrency:
  group: update-adoption
  cancel-in-progress: false

jobs:
  domains-monitor:
    name: Update Domains Monitor (GitHub-hosted)
    # Läuft morgens (05:00 UTC) ODER wenn manuell 'all' bzw. 'domains-monitor' gewählt wird
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.source == 'all' || inputs.source == 'domains-monitor'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Execute Domains Monitor update script
        run: node --dns-result-order=ipv4first scripts/update-adoption.mjs --source domains-monitor

      - name: Commit and push changes if data updated
        run: |
          if git diff --quiet data/adoption-current.json data/adoption-history.json public/sitemap.xml; then
            echo "No changes in Domains Monitor data. Skipping commit."
          else
            echo "Domains Monitor changes detected. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/adoption-current.json data/adoption-history.json public/sitemap.xml
            git commit -m "chore(adoption): update Domains Monitor data"
            git push
          fi

      # Fails the run (-> GitHub notification e-mail) if Domains Monitor
      # could not be fetched today, instead of silently keeping stale data.
      - name: Verify Domains Monitor data is fresh
        run: |
          node -e "
            const s = require('./data/adoption-current.json').sources.domainsMonitor;
            const today = new Date().toISOString().slice(0, 10);
            const fetched = (s.lastSuccessfulFetch || '').slice(0, 10);
            console.log('Domains Monitor:', s.value, '| sourceDate:', s.sourceDate, '| lastSuccessfulFetch:', s.lastSuccessfulFetch);
            if (fetched !== today) {
              console.error('::error::Domains Monitor fetch failed today (last success: ' + (s.lastSuccessfulFetch || 'never') + '). Check parser / source URL ' + s.sourceUrl);
              process.exit(1);
            }
          "

  forsaledns:
    name: Update ForSaleDNS (GitHub-hosted)
    needs: domains-monitor
    # Sequentiell nach domains-monitor (falls dieser lief), läuft auch wenn domains-monitor fehlschlug oder geskippt wurde.
    # Läuft nachmittags (13:30 UTC = 15:30 MESZ / 14:30 MEZ) ODER wenn manuell 'all' bzw. 'forsaledns' gewählt wird.
    if: >-
      !cancelled() && (
        (github.event_name == 'schedule' && github.event.schedule == '30 13 * * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.source == 'all' || inputs.source == 'forsaledns'))
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Pull latest main branch
        run: |
          git pull origin main --ff-only || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Execute ForSaleDNS update script
        run: node scripts/update-adoption.mjs --source forsaledns

      - name: Commit and push changes if data updated
        run: |
          if git diff --quiet data/adoption-current.json data/adoption-history-forsaledns.json public/sitemap.xml; then
            echo "No changes in ForSaleDNS data. Skipping commit."
          else
            echo "ForSaleDNS changes detected. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/adoption-current.json data/adoption-history-forsaledns.json public/sitemap.xml
            git commit -m "chore(adoption): update ForSaleDNS data"
            git push
          fi

      - name: Verify ForSaleDNS data is fresh
        run: |
          node -e "
            const f = require('./data/adoption-current.json').forSaleDns || {};
            const ageMin = (Date.now() - Date.parse(f.lastSuccessfulFetch || '')) / 60000;
            console.log('ForSaleDNS: snapshot:', f.latestSnapshotDate, '| lastSuccessfulFetch:', f.lastSuccessfulFetch, '| age (min):', Math.round(ageMin));
            if (ageMin >= 0 && ageMin <= 120) {
              console.log('✓ ForSaleDNS data fetched fresh in this run.');
            } else {
              console.error('::error::ForSaleDNS fetch was not updated in this run (last success: ' + (f.lastSuccessfulFetch || 'never') + ').');
              process.exit(1);
            }
          "

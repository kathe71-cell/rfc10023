name: Update RFC 10023 Adoption Data

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-adoption:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute adoption update script
        run: node scripts/update-adoption.mjs

      - name: Commit and push changes if data updated
        run: |
          if git diff --quiet data/adoption-current.json data/adoption-history.json data/adoption-history-forsaledns.json; then
            echo "No changes in adoption data. Skipping commit."
          else
            echo "Adoption data changes detected. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/adoption-current.json data/adoption-history.json data/adoption-history-forsaledns.json
            git commit -m "chore: update RFC 10023 adoption data"
            git push
          fi

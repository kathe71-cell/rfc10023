name: Update RFC 10023 Adoption Data

on:
  schedule:
    # Täglicher Abruf jeden Morgen um 07:00 Uhr (05:00 UTC bei MESZ Sommerzeit / 06:00 UTC bei MEZ Winterzeit).
    # Beide Läufe sind idempotent (maximal 1 Eintrag pro Kalendertag und Quelle).
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-adoption
  cancel-in-progress: false

jobs:
  update-adoption:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Execute adoption update script
        run: node --dns-result-order=ipv4first scripts/update-adoption.mjs

      - name: Commit and push changes if data updated
        run: |
          if git diff --quiet data/adoption-current.json data/adoption-history.json data/adoption-history-forsaledns.json public/sitemap.xml; then
            echo "No changes in adoption data. Skipping commit."
          else
            echo "Adoption data changes detected. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/adoption-current.json data/adoption-history.json data/adoption-history-forsaledns.json public/sitemap.xml
            git commit -m "chore: update RFC 10023 adoption data"
            git push
          fi

      # Fails the run (-> GitHub notification e-mail) if Domains Monitor
      # could not be fetched today, instead of silently keeping stale data.
      - name: Verify Domains Monitor data is fresh
        run: |
          node -e "
            const s = require('./data/adoption-current.json').sources.domainsMonitor;
            const today = new Date().toISOString().slice(0, 10);
            const fetched = (s.lastSuccessfulFetch || '').slice(0, 10);
            console.log('Domains Monitor:', s.value, '| sourceDate:', s.sourceDate, '| lastSuccessfulFetch:', s.lastSuccessfulFetch);
            if (fetched !== today) {
              console.error('::error::Domains Monitor fetch failed today (last success: ' + (s.lastSuccessfulFetch || 'never') + '). Check parser / source URL ' + s.sourceUrl);
              process.exit(1);
            }
          "

      # Same check for ForSaleDNS. Runs even if the Domains Monitor check
      # failed; data of the healthy source has already been committed above.
      # If ForSaleDNS was not fetched during this run (< 60 min old) due to
      # upstream Cloudflare challenges or temporary unavailability, warn
      # prominently instead of failing the whole job when cached data is intact.
      # Only fail if no valid snapshot exists at all or if data is severely stale (> 7 days).
      - name: Verify ForSaleDNS data is fresh
        if: ${{ !cancelled() }}
        run: |
          node -e "
            const f = require('./data/adoption-current.json').forSaleDns || {};
            const ageMin = (Date.now() - Date.parse(f.lastSuccessfulFetch || '')) / 60000;
            const ageHours = ageMin / 60;
            console.log('ForSaleDNS: latestSnapshotDate:', f.latestSnapshotDate, '| lastSuccessfulFetch:', f.lastSuccessfulFetch, '| age (min):', Math.round(ageMin));
            if (ageMin >= 0 && ageMin <= 60) {
              console.log('✓ ForSaleDNS data fetched fresh in this run.');
            } else if (f.latestSnapshotDate && ageHours <= 168) {
              console.warn('::warning title=ForSaleDNS fetch skipped (using cached data)::ForSaleDNS was not fetched successfully in this run (last success: ' + (f.lastSuccessfulFetch || 'never') + '). Retaining cached snapshot from ' + f.latestSnapshotDate + ' (' + Math.round(ageHours) + 'h old).');
            } else {
              console.error('::error::ForSaleDNS has no valid snapshot or cached data is older than 7 days (last success: ' + (f.lastSuccessfulFetch || 'never') + ').');
              process.exit(1);
            }
          "

name: Update RFC 10023 Adoption Data

on:
  schedule:
    # Primary daily run (07:17 CEST). GitHub may delay or drop scheduled runs
    # under load, so a second run at 11:47 CEST acts as a safety net.
    # Both are idempotent (one history entry per day and source).
    - cron: '17 5 * * *'
    - cron: '47 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-adoption
  cancel-in-progress: false

jobs:
  update-adoption:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Execute adoption update script
        run: node scripts/update-adoption.mjs

      - name: Commit and push changes if data updated
        run: |
          if git diff --quiet data/adoption-current.json data/adoption-history.json data/adoption-history-forsaledns.json public/sitemap.xml; then
            echo "No changes in adoption data. Skipping commit."
          else
            echo "Adoption data changes detected. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/adoption-current.json data/adoption-history.json data/adoption-history-forsaledns.json public/sitemap.xml
            git commit -m "chore: update RFC 10023 adoption data"
            git push
          fi

      # Fails the run (-> GitHub notification e-mail) if Domains Monitor
      # could not be fetched today, instead of silently keeping stale data.
      - name: Verify Domains Monitor data is fresh
        run: |
          node -e "
            const s = require('./data/adoption-current.json').sources.domainsMonitor;
            const today = new Date().toISOString().slice(0, 10);
            const fetched = (s.lastSuccessfulFetch || '').slice(0, 10);
            console.log('Domains Monitor:', s.value, '| sourceDate:', s.sourceDate, '| lastSuccessfulFetch:', s.lastSuccessfulFetch);
            if (fetched !== today) {
              console.error('::error::Domains Monitor fetch failed today (last success: ' + (s.lastSuccessfulFetch || 'never') + '). Check parser / source URL ' + s.sourceUrl);
              process.exit(1);
            }
          "

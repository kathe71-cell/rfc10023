                "text": "RFC 10023 ist ein im Juli 2026 von der IETF veröffentlichter Standard ('The _for-sale Underscored and Globally Scoped DNS Node Name'), der ein maschinenlesbares Signal im DNS definiert, über das Domaininhaber Verkaufsangebote dezentral publizieren können."

              "@type": "Question",
              "name": "Welche Registries unterstützen RFC 10023 bereits?",
